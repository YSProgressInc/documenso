name: Build image

# Builds the YS Progress image for sign.ys.contact (linux/arm64, the Oracle
# Ampere host) and pushes it to GHCR. Tag the branch as <upstream>-ys.<n>,
# e.g. v2.21.1-ys.1, and point the Portainer stack's DOCUMENSO_VERSION at it.

on:
  push:
    tags: ['v*-ys.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/ysprogressinc/documenso:${{ github.ref_name }}
            ghcr.io/ysprogressinc/documenso:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
